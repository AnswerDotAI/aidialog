[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aidialog"
dynamic = ["version"]
description = "Read, search, edit, and persist AI dialogs stored as Jupyter notebooks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ['fastcore>=2.1.17']

[project.optional-dependencies]
dev = ['exhash', 'nbformat']

[project.urls]
Repository = "https://github.com/AnswerDotAI/aidialog"
Documentation = "https://AnswerDotAI.github.io/aidialog/"

[project.entry-points.nbdev]
aidialog = "aidialog._modidx:d"

[project.entry-points.pyskills]
"aidialog.dlgskill" = "aidialog.dlgskill"

[tool.setuptools.dynamic]
version = {attr = "aidialog.__version__"}

[tool.setuptools.packages.find]
include = ["aidialog"]

[tool.nbdev]
allowed_metadata_keys = ['solveit']
allowed_cell_metadata_keys = ['solveit_ai']

[tool.chkstyle]
skip_paths = ["_modidx.py"]
